name: lightweight-checks
on:
  push:
  pull_request:

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Native pre-push hook (local bare receivers, model-free)
        run: python3 tests/test-gitleaks-hook.py
      - name: Publication gate (model-free scanner/dispatch fixtures)
        run: python3 tests/test-publication-check.py
      - name: Task launch reservations (model-free)
        run: python3 tests/test-launch-gate.py
      - name: Mocked Herdr integration
        run: bash tests/test-runner.sh
      - name: Real Git worktree isolation
        run: bash tests/test-worktree.sh
      - name: Pair launch and failure isolation (mock runners)
        run: bash tests/test-pair.sh
      - name: Controlled pair lifecycle orders (mock runners)
        run: python3 tests/test-pair-order.py
      - name: Root acceptance and cleanup gates (mocked Herdr)
        run: python3 tests/test-finish-agent.py
      - name: Bash syntax
        run: bash -n scripts/*.sh tests/*.sh
